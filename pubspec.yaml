name: push_kit
description: Flutter bridge for Huawei, Xiaomi, OPPO, vivo and Apple push notifications.
version: 1.1.0
homepage: https://github.com/Wgga/push_kit
repository: https://github.com/Wgga/push_kit
issue_tracker: https://github.com/Wgga/push_kit/issues

environment:
  sdk: '>=3.7.0 <4.0.0'
  flutter: '>=3.29.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2
  args: ^2.7.0
  xml: ^6.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

executables:
  setup: setup

flutter:
  plugin:
    platforms:
      android:
        package: io.github.wgga.push_kit
        pluginClass: PushKitPlugin
      ios:
        pluginClass: PushKitPlugin
      ohos:
        pluginClass: PushKitPlugin
