group = 'io.github.wgga.push_kit'
version = '1.0.2'

buildscript {
    repositories { google(); mavenCentral(); maven { url 'https://developer.huawei.com/repo/' } }
    dependencies { classpath 'com.android.tools.build:gradle:8.11.1' }
}

// Resolve the bundled vendor AARs from this plugin regardless of where Pub
// installs the plugin. Capture the path before entering allprojects; using
// $projectDir inside that closure would point each consuming project at its
// own local-repository directory instead.
def vendorRepository = file('local-repository')

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://developer.huawei.com/repo/' }
        // Vendor AARs are published into this repository so AGP can bundle this library.
        maven { url vendorRepository.toURI() }
    }
}

apply plugin: 'com.android.library'

android {
    namespace = 'io.github.wgga.push_kit'
    compileSdk = 36
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    defaultConfig {
        minSdk = 21
        consumerProguardFiles 'consumer-rules.pro'
    }
}

dependencies {
    implementation 'androidx.core:core:1.17.0'
    implementation 'com.huawei.hms:push:6.13.0.300'
    implementation 'com.huawei.agconnect:agconnect-core:1.9.1.300'
    // Do not replace these with files('*.aar'): AGP rejects direct local AAR dependencies in AARs.
    implementation 'io.github.wgga.push-kit-vendor:mipush:6.0.1'
    implementation 'io.github.wgga.push-kit-vendor:heytap:3.7.1'
    implementation 'io.github.wgga.push-kit-vendor:vivo:4.1.0.0-510'
}
